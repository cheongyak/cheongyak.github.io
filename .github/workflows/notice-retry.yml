name: 공고문 받기 재시도
# 기능 notice_retry (2026-10-03): 새벽 수집에서 모집공고문 PDF 를 못 받은 공고만 낮 동안 2시간마다 다시 받는다 (app/notice_retry.py).
# 공고 목록·시세·경쟁률은 다시 받지 않고 알림도 보내지 않는다. 받을 공고가 없으면 아무것도 올리지 않고 1분 안에 끝난다.
on:
  schedule:
    - cron: "20 1-13/2,23 * * *"   # 한국 08:20 · 10:20 · … · 22:20
  workflow_dispatch:
concurrency:               # 새벽 수집과 겹치지 않게 같은 묶음에서 차례로 돈다
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 못 받은 공고가 있는지
        id: need
        run: |
          n=$(python3 -c "import json; print(sum(1 for r in json.load(open('docs/listings.json')) if not r.get('sample') and r.get('url') and not r.get('notice_pdf')))")
          on=$(python3 -c "import json; print(json.load(open('docs/config.json')).get('features',{}).get('notice_retry', True))")
          echo "못 받은 주택형 $n · 기능 $on"
          [ "$n" != "0" ] && [ "$on" = "True" ] && echo "go=1" >> "$GITHUB_OUTPUT" || true
      - uses: actions/setup-python@v5
        if: steps.need.outputs.go == '1'
        with:
          python-version: "3.12"
      - name: 다시 받기
        if: steps.need.outputs.go == '1'
        run: |
          pip install -q -r requirements.txt
          python -m app.notice_retry | tee /tmp/retry.log
      - name: 저장
        if: steps.need.outputs.go == '1'
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          python -m tools.build_static || true
          python -m tools.verify_status || true
          git add docs/listings.json docs/notice-cache.json docs/run-log.txt docs/verify-status.json docs/sitemap.xml
          for d in docs/notice docs/chat-notice; do [ -e "$d" ] && git add -A -- "$d"; done
          git diff --cached --quiet || (git commit -m "공고문 재시도 $(date +%Y-%m-%d\ %H:%M)" && (git push || (git pull --rebase -X theirs origin main && git push)))
      - name: 하루 마지막 재시도에도 못 받으면 운영자 알림 (이슈)
        if: steps.need.outputs.go == '1' && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ "$(date +%H)" -ge 22 ] || exit 0
          w=$(grep -E '여전히 못 받음 [1-9]|^\[경고\] 공고문을 읽지' /tmp/retry.log | head -10 || true)
          [ -z "$w" ] && exit 0
          body=$'오늘 낮 재시도에도 공고문 PDF 를 받지 못한 공고가 있어요. 화면에는 \'확인 필요\'로 보여요.\n```\n'"$w"$'\n```\n원인 점검: python -m tools.qa.pdf_fetch_probe <주택관리번호>\n실행: '"$RUN_URL"
          n=$(gh issue list --state open --search "in:title 수집 알림" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "수집 알림 $(date +%Y-%m-%d)" --body "$body"; fi
