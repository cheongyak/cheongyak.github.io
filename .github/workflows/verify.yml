name: 판정 검증
# 화면 판정 코드(docs/index.html)나 검증 사례가 바뀌면 바로 검증 사례를 돌린다 (수집 뒤 검증은 collect.yml 에서)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/changelog.json"
      - "tools/build_static.py"
      - "tools/snapshot_docs.cjs"
      - "tests/judge/**"
      - "tools/judge_check.cjs"
      - "tools/verify_status.py"
      - "tools/qa/supply_type.cjs"
      - "tools/qa/invariants.py"
      - "tools/qa/filter_check.cjs"
      - "tools/qa/consistency.cjs"
      - "tools/qa/sp_text.cjs"
      - "tools/qa/cross_rule.cjs"
      - "tools/qa/profile_keep.cjs"
      - "tools/qa/monotonic.cjs"
      - "tools/qa/snapshot.cjs"
      - "tools/qa/e2e.cjs"
      - "tools/qa/past_chat.cjs"
      - "tools/qa/lh_qa.cjs"
      - "tools/qa/lh_rental.cjs"
      - "tools/qa/lh_invariants.py"
      - "tools/qa/lh_pdf_tools.py"
      - "tools/qa/pay_audit.py"
      - "app/notice_pdf.py"
      - "chat/tools/engine_payload.cjs"
      - "tests/qa/**"
      - ".github/workflows/verify.yml"
concurrency:               # 수집과 같은 묶음이면 대기 중인 수집이 밀려 취소된다(2026-10-03) → 따로 두고 시작할 때 수집이 끝나길 기다린다 (tools/qa/wait_collect.sh)
  group: verify
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 수집이 돌고 있으면 끝날 때까지 기다리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/qa/wait_collect.sh 45 lh   # 청약 수집 + LH 임대 수집이 끝난 뒤 (LH 데이터 검사가 수집 전 옛 데이터를 보지 않게)
          git pull -q --ff-only origin main   # 기다리는 동안 수집이 올린 최신 데이터에서 시작
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 판정 검증 사례 실행
        continue-on-error: true
        run: |
          npm i --no-save --no-package-lock playwright@1.56.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node tools/judge_check.cjs | tee /tmp/judge.txt
      - name: MASTER QA 검사 (공급유형 표시 전수 · 데이터 불변식, 기능 qa_gate)
        if: always()
        continue-on-error: true
        run: |
          node tools/qa/supply_type.cjs | tail -1 | tee -a docs/run-log.txt
          python -m tools.qa.invariants | tee -a docs/run-log.txt
          pip install -q httpx >/dev/null 2>&1; python -m tools.qa.pay_audit | tail -1 | tee -a docs/run-log.txt || true   # 계약금 비율 ↔ 공고문 금액 줄 독립 점검 (실패는 verify_status 가 셈)
          node tools/qa/filter_check.cjs | head -1 | tee -a docs/run-log.txt
          node tools/qa/consistency.cjs | head -1 | tee -a docs/run-log.txt
          node tools/qa/sp_text.cjs | head -1 | tee -a docs/run-log.txt
          node tools/qa/cross_rule.cjs | head -1 | tee -a docs/run-log.txt   # 교차 규칙 모순 (evidence/qa/CROSS_RULES.md)
          node tools/qa/profile_keep.cjs | head -1 | tee -a docs/run-log.txt   # 저장한 내 조건이 새로고침 뒤 그대로인지
          node tools/qa/monotonic.cjs | head -1 | tee -a docs/run-log.txt   # 모르는데 가능·경계값 되돌아감 (정보·값 단조성)
          node tools/qa/zero_default.cjs | head -1 | tee -a docs/run-log.txt   # 비워 둔 기본값 0 칸(배우자 집·소득·현금 등)을 값으로 본 판정 (2026-10-06)
          node tools/qa/spouse_fix.cjs | tail -1 | tee -a docs/run-log.txt   # 배우자 집 '바로 답하기' 커서·답 반영 (2026-10-06 제보)
          node tools/qa/score_input.cjs | tail -1 | tee -a docs/run-log.txt   # 가점 '입력하기' → 빠진 칸으로 (2026-10-06 제보)
          node tools/qa/input_nav.cjs docs 40 | head -1 | tee -a docs/run-log.txt   # 입력 버튼 전수: 누르면 그 판정을 바꾸는 칸으로 가는지 (공고 40개, 2026-10-06)
          node tools/qa/snapshot.cjs | head -1 | tee -a docs/run-log.txt   # 화면 글자 스냅샷 (고정 공고·고정 날짜) — 일부러 바꾸면 --update 로 기준 갱신
          node tools/qa/e2e.cjs | head -1 | tee -a docs/run-log.txt   # 사용자 흐름 30개 + 저장 조건 퍼징 390개 (3~4분)
          node tools/qa/past_chat.cjs | head -1 | tee -a docs/run-log.txt   # 지난 공고 판정 줄·청약봇 판정 요약이 화면과 같은지
          python -m tools.qa.lh_invariants | head -1 | tee -a docs/run-log.txt   # LH 임대 데이터 불변식·정답 대조 (기능 lh_rental)
          python -m tools.qa.lh_pdf_tools | tail -1 | tee -a docs/run-log.txt   # LH 공고문 읽기 도구별 정확도·합친 값 (기능 lh_pdf_multi)
          node tools/qa/lh_qa.cjs 150 | head -1 | tee -a docs/run-log.txt   # LH 임대 판정 퍼징·단조성·답하기 고리·카드=상세
          node tools/qa/lh_rental.cjs | tail -1 | tee -a docs/run-log.txt   # LH 임대 화면 390px 밝은·어두운·답하기 흐름
      - name: 정적 문서·가이드 페이지 다시 만들기 (검색엔진·광고 심사용)
        continue-on-error: true
        run: |
          pip install -q -r requirements.txt
          node tools/snapshot_docs.cjs && python -m tools.build_static
      - name: 검증 요약 저장
        run: |
          set +e
          python -m tools.verify_status
          rc=$?
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- docs/verify-status.json docs/judge-status.json evidence/qa/supply-type.json evidence/qa/invariants.json evidence/qa/filter-check.json evidence/qa/consistency.json evidence/qa/sp-text.json evidence/qa/cross-rule.json evidence/qa/profile-keep.json evidence/qa/monotonic.json evidence/qa/zero-default.json evidence/qa/input-nav.json evidence/qa/snapshot.json evidence/qa/e2e.json evidence/qa/past-chat.json evidence/qa/lh-invariants.json evidence/qa/lh-pdf-tools.json evidence/qa/lh-qa.json evidence/qa/lh-screen.json docs/sitemap.xml $(for d in docs/story docs/about docs/terms docs/privacy docs/updates docs/guide docs/notice; do [ -e "$d" ] || git ls-files --error-unmatch "$d" >/dev/null 2>&1 && echo "$d"; done)
          # 다른 작업(근거 자료 모으기 등)과 push 가 겹치면 예전엔 조용히 사라졌다(2026-10-09·11 verify-status 가 갱신 안 됨) → 3번까지 다시 받아 올리고, 끝내 못 올리면 실패로 보이게
          if ! git diff --cached --quiet; then
            git commit -m "판정 검증 결과 $(date +%Y-%m-%d)"
            pushed=0
            for n in 1 2 3 4; do
              git push && { pushed=1; break; }
              git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X theirs --no-edit origin main; }
              sleep $((n * 7))
            done
            [ "$pushed" = 1 ] || { echo "::error::검증 결과를 올리지 못했어요 (push 4번 실패)"; rc=1; }
          fi
          exit $rc
      - name: 실패하면 운영자 알림 (이슈)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          w=$(grep -E '^\[판정 검증' /tmp/judge.txt | head -30 || true)
          gh issue create --title "판정 검증 실패 $(date +%Y-%m-%d)" --body "$(printf '판정 검증 사례가 화면 판정과 달라요.\n\n```\n%s\n```\n\n실행: %s\n\n처리 절차는 CLAUDE.md 4항.' "$w" "$RUN_URL")"
