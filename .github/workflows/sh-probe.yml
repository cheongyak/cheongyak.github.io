name: SH 임대 원천 점검
# SH 인터넷청약시스템 주택임대 게시판·첨부를 받을 수 있는지 evidence/qa/sh/ 에 남긴다 (tools/qa/sh_probe.py, 조사 단계). 수집·판정과 따로 — 손으로 실행하거나 도구가 바뀔 때만.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/qa/sh_probe.py"
      - "tools/qa/sh_links.py"
      - ".github/workflows/sh-probe.yml"
permissions:
  contents: write
concurrency:
  group: sh-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q httpx pypdf
      - run: python -m tools.qa.sh_probe
      - run: python -m tools.qa.sh_links
      - name: 저장
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/qa/sh evidence/qa/sh-probe.txt evidence/qa/sh-links.txt
          git diff --cached --quiet || (git commit -m "SH 임대 원천 점검 $(date +%Y-%m-%d)" && (git push || (git pull --rebase -X theirs origin main && git push)))
