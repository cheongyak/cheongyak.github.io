name: 과거 공고 실험
# 2026 과거 공고 실험 (기능: historical). 서비스 데이터(docs/listings.json)는 건드리지 않고 evidence/history/ 에만 쓴다. 손으로 실행하거나 tools/history 가 바뀔 때.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 21 * * 0"   # 매주 월요일 06:40 (한국) — 새로 마감된 공고를 보관함에 더한다
  push:
    branches: [main]
    paths:
      - "tools/history/**"
      - ".github/workflows/history.yml"
permissions:
  contents: write
concurrency:
  group: history
  cancel-in-progress: true
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m tools.history.probe
      - run: python -m tools.history.build
      - name: 그때 넣었다면 판정용 데이터 (6/15 이후 마감 공고, 실패해도 계속)
        continue-on-error: true
        run: python -m tools.history.enrich
      - name: 랜덤 검증 (고정 seed = 날짜, 실패해도 계속)
        continue-on-error: true
        run: python -m tools.history.validate_sample --size 120
      - name: 저장
        if: always()
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/history docs/archive || true
          git diff --cached --quiet || (git commit -m "과거 공고 실험 기록 $(date +%Y-%m-%d)" && (git push || (git pull --rebase -X theirs origin main && git push)))
