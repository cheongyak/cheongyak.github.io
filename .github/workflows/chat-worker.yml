name: 청약봇 서버 배포
# 청약봇 서버(chat/worker)를 Cloudflare Workers 에 올린다 (기능: chatbot). 알림 서버(push/)와 따로 있는 Worker 다.
# 필요한 GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (알림 서버와 같은 값),
#   CHAT_PREVIEW_CODE(미리보기 코드), CHAT_STATS_TOKEN(하루 합계용 긴 무작위 문자열), ANTHROPIC_API_KEY(없으면 AI 없이 고정 문구로만 답함)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "chat/worker/**"
      - "chat/test/**"
      - ".github/workflows/chat-worker.yml"
concurrency:
  group: chat-worker
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHAT_PREVIEW_CODE: ${{ secrets.CHAT_PREVIEW_CODE }}
      CHAT_STATS_TOKEN: ${{ secrets.CHAT_STATS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 청약봇 검증 (검사기·제한·가림·잠금 시험, 골든셋)
        working-directory: chat
        env:
          ANTHROPIC_API_KEY: ""   # 배포 때 골든셋 270문항을 실제 Claude 로 돌리지 않는다(비용·시간). 실제 답 시험은 chat-probe.yml
        run: |
          node --test test/chat.test.mjs
          node golden/eval.mjs
          node golden/eval.mjs --fixtures golden/fixtures_good.json
      - name: 비밀값 확인
        id: secrets
        run: |
          miss=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CHAT_PREVIEW_CODE CHAT_STATS_TOKEN; do [ -z "${!k}" ] && miss="$miss $k"; done
          if [ -n "$miss" ]; then echo "::notice::GitHub Secrets 에$miss 가 없어 배포하지 않아요"; echo "ready=0" >> "$GITHUB_OUTPUT"; else echo "ready=1" >> "$GITHUB_OUTPUT"; fi
          [ -z "$ANTHROPIC_API_KEY" ] && echo "::warning::ANTHROPIC_API_KEY 가 없어 AI 없이 고정 문구로만 답해요" || true
      - name: workers.dev 주소·KV 준비
        if: steps.secrets.outputs.ready == '1'
        id: prep
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          H=(-sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          sub=$(curl "${H[@]}" "$API/workers/subdomain" | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
          [ -z "$sub" ] && { echo "::error::workers.dev 주소가 없어요 (알림 서버 배포를 먼저 해 주세요)"; exit 1; }
          kv=$(curl "${H[@]}" "$API/storage/kv/namespaces?per_page=100" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((n['id'] for n in d.get('result') or [] if n['title']=='cheongyakpass-chat'),''))")
          if [ -z "$kv" ]; then
            kv=$(curl "${H[@]}" -X POST "$API/storage/kv/namespaces" -d '{"title":"cheongyakpass-chat"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or {}).get('id') or '')")
          fi
          [ -z "$kv" ] && { echo "::error::KV 를 만들지 못했어요 (API 토큰 권한: Workers KV Storage 편집)"; exit 1; }
          sed -i "s/__KV_ID__/$kv/" chat/worker/wrangler.toml
          echo "url=https://cheongyakpass-chat.$sub.workers.dev" >> "$GITHUB_OUTPUT"
      - name: 배포
        if: steps.secrets.outputs.ready == '1'
        working-directory: chat/worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy
          printf %s "$CHAT_PREVIEW_CODE" | npx --yes wrangler@4 secret put CHAT_PREVIEW_CODE
          printf %s "$CHAT_STATS_TOKEN" | npx --yes wrangler@4 secret put CHAT_STATS_TOKEN
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf %s "$ANTHROPIC_API_KEY" | npx --yes wrangler@4 secret put ANTHROPIC_API_KEY; fi
      - name: 배포 확인·기록
        if: steps.secrets.outputs.ready == '1'
        env:
          URL: ${{ steps.prep.outputs.url }}
        run: |
          set -euo pipefail
          sleep 5
          h=$(curl -fsS "$URL/health"); echo "$h"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/stats")
          [ "$code" = "401" ] || { echo "::error::토큰 없는 합계 요청이 거절되지 않았어요 ($code)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/chat" -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "403" ] || { echo "::error::다른 사이트 요청이 거절되지 않았어요 ($code)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CHAT_STATS_TOKEN" "$URL/stats")
          [ "$code" = "200" ] || { echo "::error::합계 읽기 실패 ($code)"; exit 1; }
          key=$(echo "$h" | python3 -c "import json,sys; print(str(json.load(sys.stdin).get('key')).lower())")
          printf '{"url": "%s", "ai_key": %s, "deployed_at": "%s", "commit": "%s"}\n' "$URL" "$key" "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" "${GITHUB_SHA::7}" > chat/deployed.json
          git checkout -- chat/worker/wrangler.toml
          git config user.name "cheongyak-bot"; git config user.email "actions@users.noreply.github.com"
          git add chat/deployed.json
          git diff --cached --quiet || (git commit -m "청약봇 서버 배포 기록" && (git push || (git pull --rebase origin main && git push)))
          echo "::notice::청약봇 서버 주소 $URL"
