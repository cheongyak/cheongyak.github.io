name: 청약 공고 수집
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - name: 올린 zip 풀기 (처음 한 번)
        run: |
          if [ -f cheongyak-backend.zip ]; then
            unzip -o -q cheongyak-backend.zip -d /tmp/src
            rsync -a --exclude '.github' /tmp/src/cheongyak-backend/ ./
            git rm -q --cached cheongyak-backend.zip || true
            rm -f cheongyak-backend.zip
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: API 응답 필드 확인
        continue-on-error: true
        run: python -m app.inspect_fields
      - name: 공고 수집 · 시세 · 등급
        run: python -m app.pipeline
      - name: 저장
        run: |
          mkdir -p docs
          cp data/listings.json docs/listings.json
          date +"%Y-%m-%d %H:%M" > docs/updated.txt
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -q data .env 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "공고 데이터 갱신 $(date +%Y-%m-%d)" && git push)
