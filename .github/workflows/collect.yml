name: 청약 공고 수집
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:                     # 코드가 바뀌면 바로 한 번 돌려서 결과를 확인한다
    branches: [main]
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"
concurrency:               # 수집은 한 번에 하나만 돈다. 겹치면 앞 실행이 끝날 때까지 기다린다 (2026-10-01 01:16/01:23 두 실행이 겹쳐 뒤 실행의 옛 데이터가 덮어쓴 문제)
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
  issues: write             # 수집 실패·경고를 이슈로 남겨 운영자에게 메일이 가게 한다
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      NCP_MAPS_CLIENT_ID: ${{ secrets.NCP_MAPS_CLIENT_ID }}
      NCP_MAPS_CLIENT_SECRET: ${{ secrets.NCP_MAPS_CLIENT_SECRET }}
      PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}   # 웹 푸시 발송 토큰 (기능: web_push). 없으면 보내지 않는다
      CHAT_STATS_TOKEN: ${{ secrets.CHAT_STATS_TOKEN }}   # 청약봇 하루 합계 읽기 (기능: chatbot). 없으면 건너뛴다
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # 기다렸다 시작해도 앞 실행이 올린 최신 데이터(시세·공고문 보관 기록)에서 시작한다
      - name: 올린 zip 풀기 (처음 한 번)
        run: |
          if [ -f cheongyak-backend.zip ]; then
            unzip -o -q cheongyak-backend.zip -d /tmp/src
            rsync -a --exclude '.github' /tmp/src/cheongyak-backend/ ./
            git rm -q --cached cheongyak-backend.zip || true
            rm -f cheongyak-backend.zip
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: API 응답 필드 확인
        continue-on-error: true
        run: python -m app.inspect_fields
      - name: 공고 수집 · 시세 · 등급
        run: python -m app.pipeline
      - name: 저장
        run: |
          mkdir -p docs
          cp data/listings.json docs/listings.json
          date +"%Y-%m-%d %H:%M" > docs/updated.txt
          # 지도 표시용 Client ID (사이트 주소가 등록된 키라 페이지에 들어가도 다른 곳에서는 쓸 수 없다. Secret 은 내보내지 않는다)
          if [ -n "$NCP_MAPS_CLIENT_ID" ]; then printf '{"naver_map_key":"%s"}\n' "$NCP_MAPS_CLIENT_ID" > docs/map.json; fi
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -q data .env 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "공고 데이터 갱신 $(date +%Y-%m-%d)" && (git push || (git pull --rebase -X theirs origin main && git push)))
      - name: 공고별 페이지 다시 만들기 (기능 notice_pages · 정적 페이지, v1.2.0)
        continue-on-error: true
        run: |
          python -m tools.build_static
          git add -A -- docs/sitemap.xml $(for d in docs/notice docs/guide docs/story docs/about docs/terms docs/privacy docs/updates; do [ -e "$d" ] || git ls-files --error-unmatch "$d" >/dev/null 2>&1 && echo "$d"; done)
          git diff --cached --quiet || (git commit -m "공고 페이지 갱신 $(date +%Y-%m-%d)" && (git push || (git pull --rebase -X theirs origin main && git push)))
      # ---- 수집 뒤 필수 검증 (CLAUDE.md 4항): 판정 검증 사례 + 공고문 대조 결과를 모아 docs/verify-status.json 으로 공개, 다르면 실패 ----
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "20"
      - name: 청약봇 하루 합계 (기능 chatbot — 개인 식별 없는 합계만)
        if: always()
        continue-on-error: true
        run: |
          [ -n "$CHAT_STATS_TOKEN" ] && [ -f chat/deployed.json ] || exit 0
          url=$(python3 -c "import json; print(json.load(open('chat/deployed.json'))['url'])")
          curl -fsS -H "Authorization: Bearer $CHAT_STATS_TOKEN" "$url/stats" | python3 chat/tools/stats_line.py | tee -a docs/run-log.txt
      - name: 판정 검증 사례 실행 (tests/judge, 144건+)
        if: always()
        continue-on-error: true
        run: |
          npm i --no-save --no-package-lock playwright@1.56.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node tools/judge_check.cjs | tee -a docs/run-log.txt
      - name: MASTER QA 검사 (공급유형 표시 전수 · 데이터 불변식, 기능 qa_gate)
        if: always()
        continue-on-error: true
        run: |
          node tools/qa/supply_type.cjs | tail -1 | tee -a docs/run-log.txt
          python -m tools.qa.invariants | tee -a docs/run-log.txt
          node tools/qa/filter_check.cjs | head -1 | tee -a docs/run-log.txt
          node tools/qa/consistency.cjs | head -1 | tee -a docs/run-log.txt
      - name: 검증 요약 저장
        id: verify
        if: always()
        run: |
          set +e
          python -m tools.verify_status | tee -a docs/run-log.txt
          rc=${PIPESTATUS[0]}
          git add docs/verify-status.json docs/judge-status.json docs/run-log.txt evidence/qa/supply-type.json evidence/qa/invariants.json evidence/qa/filter-check.json evidence/qa/consistency.json
          git diff --cached --quiet || (git commit -m "검증 결과 $(date +%Y-%m-%d)" && (git push || (git pull --rebase -X theirs origin main && git push)))
          exit $rc
      - name: 경고가 있으면 운영자 알림 (이슈)
        if: always() && github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          body=""
          if [ "$JOB_STATUS" != "success" ]; then body="수집 실행이 실패했어요 ($JOB_STATUS)."; fi
          if [ -f docs/run-log.txt ]; then
            w=$(grep -E '^\[(경고|검증·정답 불일치|검증·공고문 불일치|판정 검증·불일치|판정 검증·화면 오류)' docs/run-log.txt | head -30 || true)
            if [ -n "$w" ]; then body="$body"$'\n\n실행 기록의 경고:\n```\n'"$w"$'\n```'; fi
          fi
          body="${body#$'\n\n'}"
          [ -z "$body" ] && exit 0
          body="$body"$'\n\n실행: '"$RUN_URL"$'\n\n처리 절차는 CLAUDE.md 4항. 확인 후 이 이슈를 닫아 주세요.'
          n=$(gh issue list --state open --search "in:title 수집 알림" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "수집 알림 $(date +%Y-%m-%d)" --body "$body"; fi
