name: 알림 서버 배포
# 웹 푸시 알림 서버(push/worker.js)를 Cloudflare Workers 에 올린다 (기능: web_push).
# 필요한 GitHub Secrets: CLOUDFLARE_API_TOKEN(‘Edit Cloudflare Workers’ 템플릿), CLOUDFLARE_ACCOUNT_ID, PUSH_SEND_TOKEN(아무 긴 무작위 문자열)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "push/worker.js"
      - "push/wrangler.toml"
      - ".github/workflows/push-worker.yml"
concurrency:
  group: push-worker
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 알림 서버 검증 (메모리 KV·가짜 푸시 서비스)
        run: node push/test.mjs
      - name: 비밀값 확인
        id: secrets
        run: |
          miss=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && miss="$miss CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && miss="$miss CLOUDFLARE_ACCOUNT_ID"
          [ -z "$PUSH_SEND_TOKEN" ] && miss="$miss PUSH_SEND_TOKEN"
          if [ -n "$miss" ]; then echo "::notice::GitHub Secrets 에$miss 가 없어 배포하지 않아요"; echo "ready=0" >> "$GITHUB_OUTPUT"; else echo "ready=1" >> "$GITHUB_OUTPUT"; fi
      - name: workers.dev 주소·KV 준비
        if: steps.secrets.outputs.ready == '1'
        id: prep
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          H=(-sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          # 계정의 workers.dev 하위 주소 (처음이면 만든다)
          sub=$(curl "${H[@]}" "$API/workers/subdomain" | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
          if [ -z "$sub" ]; then
            for name in cheongyakpass cheongyakpass-kr cheongyakpass-push; do
              sub=$(curl "${H[@]}" -X PUT "$API/workers/subdomain" -d "{\"subdomain\":\"$name\"}" | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
              [ -n "$sub" ] && break
            done
          fi
          [ -z "$sub" ] && { echo "::error::workers.dev 주소를 만들지 못했어요. Cloudflare 화면에서 Workers & Pages 를 한 번 열어 주세요"; exit 1; }
          # 구독 보관용 KV (이름으로 찾고 없으면 만든다)
          kv=$(curl "${H[@]}" "$API/storage/kv/namespaces?per_page=100" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((n['id'] for n in d.get('result') or [] if n['title']=='cheongyakpass-push-subs'),''))")
          if [ -z "$kv" ]; then
            kv=$(curl "${H[@]}" -X POST "$API/storage/kv/namespaces" -d '{"title":"cheongyakpass-push-subs"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or {}).get('id') or '')")
          fi
          [ -z "$kv" ] && { echo "::error::KV 를 만들지 못했어요 (API 토큰 권한: Workers KV Storage 편집)"; exit 1; }
          sed -i "s/__KV_ID__/$kv/" push/wrangler.toml
          echo "url=https://cheongyakpass-push.$sub.workers.dev" >> "$GITHUB_OUTPUT"
      - name: 배포
        if: steps.secrets.outputs.ready == '1'
        working-directory: push
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy
          printf %s "$PUSH_SEND_TOKEN" | npx --yes wrangler@4 secret put SEND_TOKEN
      - name: 배포 확인·기록
        if: steps.secrets.outputs.ready == '1'
        env:
          URL: ${{ steps.prep.outputs.url }}
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS "$URL/health"
          key=$(curl -fsS "$URL/vapid" | python3 -c "import json,sys; print(json.load(sys.stdin)['key'])")
          [ ${#key} -ge 80 ] || { echo "::error::VAPID 키를 받지 못했어요"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/send" -H 'Content-Type: application/json' -d '{"events":[]}')
          [ "$code" = "401" ] || { echo "::error::토큰 없는 발송이 거절되지 않았어요 ($code)"; exit 1; }
          printf '{"url": "%s", "vapid": "%s", "deployed_at": "%s", "commit": "%s"}\n' "$URL" "$key" "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" "${GITHUB_SHA::7}" > push/deployed.json
          git checkout -- push/wrangler.toml
          git config user.name "cheongyak-bot"; git config user.email "actions@users.noreply.github.com"
          git add push/deployed.json
          git diff --cached --quiet || (git commit -m "알림 서버 배포 기록" && (git push || (git pull --rebase origin main && git push)))
          echo "::notice::알림 서버 주소 $URL"
