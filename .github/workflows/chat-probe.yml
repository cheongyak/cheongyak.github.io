name: 청약봇 실제 답 시험
# 운영자 미리보기 코드로 배포된 청약봇에 질문을 보내고, AI 시도 결과(diag)와 답을 evidence/chat-probe/ 에 남긴다.
# 질문은 chat/probe_questions.json. 실제 AI 를 부르므로 토큰이 조금 든다(질문당 약 $0.01).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "chat/probe_questions.json"
      - ".github/workflows/chat-probe.yml"
permissions:
  contents: write
concurrency:
  group: chat-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODE: ${{ secrets.CHAT_PREVIEW_CODE }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - name: 질문 보내기
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, time
          url = json.load(open('chat/deployed.json'))['url'] + '/chat'
          qs = json.load(open('chat/probe_questions.json'))
          out = []
          for i, q in enumerate(qs):
              body = {'question': q['question'], 'anon_id': 'probe-actions-%d' % int(time.time()), 'conversation_id': 'probe-%d-%d' % (int(time.time()), i), 'preview': os.environ['CODE']}
              if q.get('listing_id'): body['listing_id'] = q['listing_id']
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={'content-type': 'application/json', 'origin': 'https://cheongyakpass.kr'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: st, res = r.status, json.loads(r.read())
              except urllib.error.HTTPError as e: st, res = e.code, json.loads(e.read() or b'{}')
              out.append({'question': q['question'], 'status': st, 'fallback': res.get('fallback'), 'diag': res.get('diag'), 'answer': res.get('answer'), 'message': res.get('message')})
              print(st, q['question'][:30], json.dumps(res.get('diag'), ensure_ascii=False))
          os.makedirs('evidence/chat-probe', exist_ok=True)
          json.dump({'at': time.strftime('%Y-%m-%d %H:%M'), 'results': out}, open('evidence/chat-probe/latest.json', 'w'), ensure_ascii=False, indent=1)
          PY
      - name: 저장
        if: always()
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A evidence/chat-probe
          git diff --cached --quiet || (git commit -m "청약봇 실제 답 시험 $(date +%Y-%m-%d)" && (git push || (git pull --rebase -X theirs origin main && git push)))
