name: 근거 자료 모으기
# 판정 규칙을 만들기 전에 공고문 원문·화면 구조를 모으는 작업 (tools/ 가 바뀌거나 손으로 실행할 때만). 결과는 evidence/, docs/rules-evidence.txt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/probe.yml"
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      NCP_MAPS_CLIENT_ID: ${{ secrets.NCP_MAPS_CLIENT_ID }}
      NCP_MAPS_CLIENT_SECRET: ${{ secrets.NCP_MAPS_CLIENT_SECRET }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m tools.rules_probe
      - name: MASTER QA 원문 대조용 공고문 (실패해도 계속)
        continue-on-error: true
        run: python -m tools.qa.fetch_notices
      - name: 수도권 노선별 역 좌표 (청약봇 V2 노선 조건, 실패해도 계속)
        continue-on-error: true
        run: python -m tools.subway_lines
      - name: 시군구 코드 못 찾은 공고 점검 (실패해도 계속)
        continue-on-error: true
        run: python -m tools.qa.lawd_probe
      - name: LH 임대 공고 받기 점검 (실패해도 계속)
        continue-on-error: true
        run: python -m tools.qa.lh_probe
      - name: 공고문 PDF 받기 실패 원인 점검 (실패해도 계속)
        continue-on-error: true
        run: python -m tools.qa.pdf_fetch_probe
      - name: 공고문 PDF 읽기 점검 (첨부 고르기·쪽수 상한·빈 쪽·필수 단원·두 도구 비교, 실패해도 계속)
        continue-on-error: true
        run: |
          pip install -q pypdfium2
          python -m tools.qa.pdf_audit | tee -a docs/rules-evidence.txt
      - name: 저장
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence docs/rules-evidence.txt; [ -d chat/v2/data ] && git add chat/v2/data || true
          git diff --cached --quiet || (git commit -m "근거 자료 갱신 $(date +%Y-%m-%d)" && (git push || (git pull --rebase -X theirs origin main && git push)))
