name: 근거 자료 모으기
# 판정 규칙을 만들기 전에 공고문 원문·화면 구조를 모으는 작업 (tools/ 가 바뀌거나 손으로 실행할 때만). 결과는 evidence/, docs/rules-evidence.txt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "chat/tools/**"
      - ".github/workflows/probe.yml"
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      NCP_MAPS_CLIENT_ID: ${{ secrets.NCP_MAPS_CLIENT_ID }}
      NCP_MAPS_CLIENT_SECRET: ${{ secrets.NCP_MAPS_CLIENT_SECRET }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m tools.rules_probe
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 청약봇 근거 나누기 (공고별 docs/chat-evidence)
        run: node chat/tools/split_evidence.mjs "$PWD"
      - name: 저장
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence docs/rules-evidence.txt docs/chat-evidence
          git diff --cached --quiet || (git commit -m "근거 자료 갱신 $(date +%Y-%m-%d)" && (git push || (git pull --rebase -X theirs origin main && git push)))
