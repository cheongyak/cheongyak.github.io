function funding(L, p, opt){
  const m = grade(L);

  const existing = eok((p.loanMonthly + (p.married ? p.spouseLoan : 0)) * 12);
  const r = RULES.stressRate / 12, n = RULES.years * 12;
  const monthly = Math.max(0, income * RULES.dsr - existing) / 12;
  const loanDsr = monthly * (1 - Math.pow(1 + r, -n)) / r;
  const ltvRate = L.regulated ? RULES.ltvRegulated : RULES.ltvOther;
  /* 시세를 못 구한 공고(mktBase 없음): 예전에는 Math.min(분양가, null)=0 이라 LTV 대출이 0원이었다 (2026-10-07 사용자 제보 'LTV 70%인데 대출 0원').

  const ltvEst = !(L.mktBase > 0), ltvBase = ltvEst ? L.price : Math.min(L.price, L.mktBase);
  const loanLtv = ltvBase * ltvRate;
  const cap = L.regulated ? RULES.loanCapRegulated.find(c => (ltvEst ? L.price : L.mktBase) <= c[0])[1] : L.capital ? RULES.loanCapCapital : Infinity;
  const loan = Math.min(loanDsr, loanLtv, cap);
  const limitBy = loan === loanDsr ? 'DSR(소득)' : loan === cap ? '한도 ' + cap + '억' : '집값의 ' + ltvRate*100 + '%';
  const jeonseUnk = !(Number(opt.jeonse) > 0) && L.jeonse == null;   /* 주변 전세 시세도 없고 직접 넣지도 않음 → 보증금 0원으로 계산하지 않는다 (2026-10-07) */
  const jeonse = Number(opt.jeonse) > 0 ? eok(opt.jeonse) : (L.jeonse || 0);
  /* 현금·금융·보증금을 하나도 넣지 않았거나 소득을 넣지 않았으면(기본값 0) 자금 '부족'으로 단정하지 않는다 — 빠른 시작은 묻지 않음 (2026-10-06 점검).
     0 으로 계산해도 가능하면 그대로 가능(더 넣으면 좋아지기만 함) */
  const cashUnk = !['cash', 'liquid', 'deposit'].some(k => entered(p, k)), incUnk = !entered(p, 'income') && !(p.married && entered(p, 'spouseIncome') && p.spouseIncome > 0);
  const need = [cashUnk ? '현금·예금' : '', incUnk ? '소득' : ''].filter(Boolean).join('·');
  return { total, contractAmt, contractOk: cashNow >= contractAmt ? true : cashUnk ? null : false, cashUnk, incUnk, unk: cashUnk || incUnk, need, ltvEst, jeonseUnk, available, loan, loanDsr, loanLtv, ltvRate, cap, limitBy, jeonse,
    gapLive: total - loan - available, gapJeonse: total - jeonse - available, tax: m.tax };
}

/* 홈 화면에 추가 안내 (기능: pwa). 안드로이드 크롬은 설치 버튼, 아이폰은 공유 메뉴 안내 */
let installEvt = null;

const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
function installCard(){

/* 내 정보를 인터뷰 단계(주제)별로 보여 주고 단계 하나만 고칠 수 있게 (기능: profile_sections). 값 표시는 인터뷰 선택지 문구를 그대로 쓴다 */
const stepKey = st => st.id || st.n || st.t;
const optDate = fd => /비워두세요/.test(fd.l || '');
function fieldValue(fd, p){
  const v = p[fd.k];
  if (ZERO_KEYS.includes(fd.k) && !entered(p, fd.k)) return { t:'미입력', miss:true };   /* 기본값 0·아니요 칸을 넣지 않았으면 '없어요/0원'이 아니라 미입력 (2026-10-06 사용자 제보: 배우자 집 바로 답하기) */
  if (fd.type === 'choice') { const o = fd.o.find(([x]) => JSON.stringify(x) === JSON.stringify(v)); return o ? { t:o[1] } : fd.skip && on('optional_inputs') ? { t: fd.skip + ' (안 적음)' } : { t:'미입력', miss:true }; }
  if (fd.type === 'date') return v ? { t:v } : optDate(fd) ? { t:'없음' } : { t:'미입력', miss:true };
  if (fd.type === 'text') return v ? { t:v } : { t:'미입력', miss:true };
  if (fd.type === 'count') return v == null ? { t:'미입력', miss:true } : { t:v + '회' };
  if (fd.opt) return v == null ? { t:'입력 안 함' } : { t:fmt(eok(v)) };
  if (v == null || v === '') return { t:'미입력', miss:true };   /* 금액 칸을 비워 두면 '0원'이 아니라 미입력 (2026-10-06 전수검사: 바로 답하기가 빈 자동차·부동산 칸을 건너뜀, 내 조건에 '부동산 0원') */
  return { t:fmt(eok(v)) };
}
const fieldLabel = (fd, st) => (fd.l || st.n || st.t).replace(/\s*\([^)]*\)\s*$/, '');

/* 빠른 시작 (기능: quick_start) — 처음 온 사람은 판정에 꼭 필요한 단계(사는 곳·세대·집과 혼인·통장·세대 주택과 당첨 이력)만 먼저 묻는다.

const QUICK_STEPS = ['home', '서울 거주', '세대 구성', '세대주가 된 날', '집과 혼인', '배우자', '청약통장', '세대 주택·당첨 이력'];   /* '배우자'(혼인 중일 때만 보임): 배우자 집·소득이 판정을 가른다 (2026-10-06 점검) */
const quickMode = () => !!S.quick && on('quick_start');

/* 날짜를 년·월·일 드롭다운으로 (기능: date_select, 2026-10-01 사용자 요청 '달력이 불편해'). 셋 다 고르면 YYYY-MM-DD 로 저장, 하나라도 비우면 '입력 안 함'.
   고르는 중인 값은 DATE_PART 에 두어 화면을 다시 그려도(바로 답하기) 남게 한다. 없는 날(2월 30일 등)은 그달 마지막 날로 맞춘다 */
const DATE_PART = {};
function dateSelHtml(fd, p, label){
  const k = fd.k, v = p[k] || '', [vy, vm, vd] = v ? v.split('-').map(Number) : [], part = DATE_PART[k] || { y: vy || '', m: vm || '', d: vd || '' };
  const now = +TODAY.slice(0, 4), lo = k === 'birth' ? now - 90 : k === 'youngestBirth' ? now - 30 : now - 60, hi = k === 'youngestBirth' ? now + 1 : now;
  const ys = []; for (let y = hi; y >= lo; y--) ys.push(y);
  const opt = (arr, cur, unit, blank) => `<option value="">${blank}</option>` + arr.map(x => `<option value="${x}"${+cur === x ? ' selected' : ''}>${x}${unit}</option>`).join('');
  const r = n => Array.from({ length: n }, (_, i) => i + 1);
  return `<div class="field"><span class="lbl" id="l-${k}">${label}</span><div class="dsel" role="group" aria-labelledby="l-${k}">
    <select id="f-${k}" data-dpart="y" data-dk="${k}" aria-label="년">${opt(ys, part.y, '년', '년')}</select><select data-dpart="m" data-dk="${k}" aria-label="월">${opt(r(12), part.m, '월', '월')}</select><select data-dpart="d" data-dk="${k}" aria-label="일">${opt(r(31), part.d, '일', '일')}</select></div>
    ${v ? `<span class="hint">${vy}년 ${vm}월 ${vd}일</span>` : part.y || part.m || part.d ? '<span class="hint">년·월·일을 모두 고르면 저장돼요</span>' : ''}</div>`;
}
function dateSelChange(el){
  const k = el.dataset.dk, box = el.closest('.dsel'), g = n => (box.querySelector(`[data-dpart="${n}"]`) || {}).value || '';
  const part = { y: g('y'), m: g('m'), d: g('d') }; DATE_PART[k] = part;
  let v = '';
  if (part.y && part.m && part.d) { const last = new Date(+part.y, +part.m, 0).getDate(), d = Math.min(+part.d, last);
    v = `${part.y}-${String(part.m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; delete DATE_PART[k]; }
  else if (!part.y && !part.m && !part.d) delete DATE_PART[k];
  S.profile[k] = v; markSet(S.profile, k, !!v); save();
  const hint = el.closest('.field').querySelector('.hint');
  const txt = v ? `${+v.slice(0, 4)}년 ${+v.slice(5, 7)}월 ${+v.slice(8)}일` : part.y || part.m || part.d ? '년·월·일을 모두 고르면 저장돼요' : '';
  if (hint) hint.textContent = txt; else if (txt) el.closest('.field').insertAdjacentHTML('beforeend', `<span class="hint">${txt}</span>`);
  if (v && +v.slice(8) !== +part.d) { const ds = box.querySelector('[data-dpart="d"]'); if (ds) ds.value = String(+v.slice(8)); }
}
function fieldHtml(fd, p, groupLabel){   // 인터뷰 질문 한 칸 (vOnboard·바로 답하기 inline_fix 공용)
  if (fd.type === 'choice') {
    const optTag = fd.skip && on('optional_inputs') ? ` <span class="optag">해당하는 분만 · 안 고르면 ${esc(fd.skip)}</span>` : '';   // 기능: optional_inputs
    const opts = fd.o.map(([v, t]) => { const on = p[fd.k] === v && (!ZERO_KEYS.includes(fd.k) || entered(p, fd.k));   /* 넣지 않은 기본값(배우자 집 '없어요' 등)은 고른 것처럼 보이지 않게 */ return `<button class="opt" role="radio" aria-checked="${on}" data-set="${fd.k}" data-val='${JSON.stringify(v)}'>${t}${on ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' : ''}</button>`; }).join('');
    return `<div class="field">${fd.l ? `<span class="lbl" id="l-${fd.k}">${fd.l}${optTag}</span>` : ''}<div role="radiogroup" ${fd.l ? `aria-labelledby="l-${fd.k}"` : `aria-label="${esc(groupLabel || fd.l || '')}"`} class="${fd.two ? 'opts-2' : 'stack'}">${opts}</div></div>`;
  }
  if (fd.type === 'text') return `<div class="field"><label for="f-${fd.k}">${fd.l}</label><input type="text" id="f-${fd.k}" data-field="${fd.k}" value="${esc(p[fd.k] || '')}"></div>`;

  if (fd.type === 'date') return `<div class="field"><label for="f-${fd.k}">${on('optional_inputs') && optDate(fd) && fd.k !== 'youngestBirth' ? fd.l.replace(/\s*\(없으면 비워두세요\)/, '') + ' <span class="optag">해당하는 분만 · 비우면 없음</span>' : fd.l}</label><input type="date" id="f-${fd.k}" data-field="${fd.k}" value="${p[fd.k] || ''}"></div>`;

  return `<div class="field"><label for="f-${fd.k}">${fd.l}</label><div class="money"><input id="f-${fd.k}" inputmode="numeric" data-field="${fd.k}" data-num="1" value="${p[fd.k] || ''}" placeholder="0"><span>만원</span></div>${on('money_echo') ? mEcho(p[fd.k]) + (fd.h ? `<span class="hint">${fd.h}</span>` : '') : (fd.h ? `<span class="hint">${fd.h}</span>` : '') + (p[fd.k] ? `<span class="hint" data-echo="${fd.k}">= ${fmt(eok(p[fd.k]))}</span>` : `<span class="hint" data-echo="${fd.k}"></span>`)}</div>`;
}
function vOnboard(){
  const steps = visibleSteps(), i = Math.min(S.step, steps.length - 1), st = steps[i], p = S.profile;
  const field = fd => fieldHtml(fd, p, st.t);

  <div class="stack" style="gap:10px;padding-top:8px">

    <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${steps.length}" aria-valuenow="${i + 1}"><i style="width:${(i + 1) / steps.length * 100}%"></i></div>

  ${note ? `<div class="note info"><b style="font-size:13px">이렇게 판정돼요</b><div>${note}</div></div>` : ''}
  <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px">
    <button class="btn ghost" data-action="prev">${i === 0 ? '닫기' : '이전'}</button>
    <button class="btn" data-action="next">${i === steps.length - 1 ? '판정 보기' : '다음'}</button>
  </div>
  ${on('profile_sections') ? `<button class="linkbtn small" data-action="onboard-exit" style="align-self:center">${S.fromMe ? '여기까지 저장하고 내 조건으로' : '여기까지 저장하고 나가기 (나머지는 내 조건에서 언제든)'}</button>` : ''}`;
}

/* 오류 신고 (기능: report_form). config.json 의 report_form_url 에 구글폼 '미리 채워진 링크'를 넣고, 공고 칸 값 자리에 {listing} 을 둔다 */
function reportUrl(L){
  const u = CONFIG.report_form_url;
  if (!on('report_form') || !u) return '';
  const what = L ? L.name + (L.unitName || L.unit ? ' ' + (L.unitName || L.unit) : '') + ' (' + (L.id || '').split('-')[0] + ')' : '';
  return u.replace('{listing}', encodeURIComponent(what));
}
function reportLink(L){
  const u = reportUrl(L);
  return u ? `<a class="btn ghost" href="${esc(u)}" target="_blank" rel="noopener" data-ev="report">이 공고 정보가 틀렸어요 (오류 신고)</a>` : '';
}

function cmpPool(){ return LISTINGS.filter(L => WATCH.has(L.id) && !L.sample).sort((a, b) => (statusOf(a) === '마감') - (statusOf(b) === '마감')); }
function cmpList(){
  const pool = cmpPool(), ids = (S.cmp || []).filter(id => pool.some(L => L.id === id));
  const pick = ids.length ? ids : pool.slice(0, 3).map(L => L.id);
  return pick.map(id => pool.find(L => L.id === id)).filter(Boolean);
}
function compareEntry(){
  if (!on('compare') || S.filter !== 'watch') return '';
  const n = cmpPool().length;
  return n >= 2 ? `<button class="btn ghost" data-go="compare">관심 공고 나란히 비교 (${Math.min(n, 3)}개)</button>` : '<p class="small muted">관심 공고를 2개 이상 담으면 나란히 비교할 수 있어요.</p>';
}

/* ---------- 지역별 당첨 가점 컷 (기능: score_cut) ----------
   docs/cmpet-history.json (청약홈 경쟁률·당첨 가점 기록) 에서 1순위 해당지역 가점제 당첨자의 최저 가점을 지역별로 모은다.
   최저 가점 0 은 가점제 당첨자가 없던 경우라 뺀다. */
let HIST = null, HIST_ERR = '';
function loadHist(){
  if (HIST || HIST_ERR) return;
  fetch('cmpet-history.json', { cache:'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(h => { HIST = h; if (S.view === 'trend') render(); })
    .catch(e => { HIST_ERR = '기록을 불러오지 못했어요 (' + e + ')'; if (S.view === 'trend') render(); });
}
function cutRows(){
  const out = [];
  Object.entries(HIST || {}).forEach(([no, v]) => {
    if (v.category === 'remainder') return;
    Object.values(v.units || {}).forEach(u => {
      if (String(u.rank) !== '1' || !(u.reside || '').includes('해당') || u.low == null || !(u.low > 0)) return;
      out.push({ no, name: v.name, sido: v.sido, sg: (v.sigungu || '').split(' ')[0], notice: v.notice || v.apply || '', unit: u.unit, low: u.low, avg: u.avg, top: u.top, url: v.url });
    });
  });
  return out;
}
const median = a => { const b = a.slice().sort((x, y) => x - y), n = b.length; return n ? (n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2) : null; };
function cutBar(lows, mine){
  const lo = Math.min(...lows), hi = Math.max(...lows), md = median(lows), pct = v => (v / 84 * 100).toFixed(1) + '%';
  return `<div class="cutbar" aria-hidden="true"><span class="rng" style="left:${pct(lo)};width:${pct(hi - lo)}"></span><span class="md" style="left:${pct(md)}"></span>${mine != null ? `<span class="me" style="left:${pct(mine)}"></span>` : ''}</div>`;
}
/* ---------- 관심 공고 내 당첨 점수 (기능: watch_scores) ----------

    noticePdf:x.notice_pdf || null, noticeQuotes:x.notice_quotes || null, category:x.category || null, area:x.area || null, accountMonths:x.account_months || null, depositCount:x.deposit_count || null, competition:x.competition || null, areaComps:Array.isArray(x.area_comps) ? x.area_comps : null, spCompetition:x.sp_competition || null, areaSp:Array.isArray(x.area_sp) ? x.area_sp : null, unitName:x.unit, address:x.address || '', geo:x.geo || null, nearby:Array.isArray(x.nearby) ? x.nearby : null, mapQuery:x.map_query || null, fromNotice:x.from_notice || [], checks:x.checks || [],
    specialApply:x.special_apply || null, houseDtl:x.house_dtl || null, rentSecd:x.rent_secd || null, rental:!!x.rental, applyEnd:x.apply_end || null, unit:x.unit + (x.households ? ' · ' + x.households + '세대' : ''), households:x.households || 0, specialUnits:x.special_units || null, residence:x.residence || null, mcQuota:x.mc_quota || null, schedule:x.schedule || null, youth:on('youth_special') ? (x.youth || null) : null, pubLimits:x.pub_limits || null, scoreRatio:x.score_ratio || null,
    notice:x.notice, apply:x.apply, winner:x.winner, contract:x.contract, balance:x.balance,
    price:x.price, ext:x.ext || 0, contractRate:x.contract_rate || 0.1, midRate:x.mid_rate || 0,
    mktLow:x.mkt_low, mktBase:x.mkt_base, mktNote:x.mkt_note || '', jeonse:x.jeonse, jeonseNote:x.jeonse_note || '',
    capital:x.capital, regulated:x.regulated, landPermit:x.land_permit, priceCap:x.price_cap, residenceDuty:x.residence_duty, dutySilent:!!x.duty_silent, dutyFrom:x.duty_from || null,
    jeonseWeak:x.jeonse_weak, unregistered:x.unregistered, needHead:x.need_head, needAccount:x.need_account,
    limits:(x.limits || []).filter(l => on('resale_limit') || l[0] !== '전매 제한').map(l => [l[0], l[1]]), sources: x.url ? [['모집공고 (청약홈)', x.url]] : [] };
}
render();
try { navPending = navParse(location.hash); if (!(history.state && history.state.nav)) history.replaceState({ nav:1, v: S.view, id: null, y: 0 }, ''); } catch(e) {}   // 기능: history_nav
if (navPending && !NAV_ID_VIEWS.includes(navPending.v) && on('history_nav') && S.view !== 'onboard') { navApply(navPending); try { history.replaceState({ nav:1, v: S.view, id: navId(S.view) || null, y: 0 }, ''); } catch(e) {} navPending = null; }
fetch('config.json', { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(c => {
  if (c) CONFIG = Object.assign(CONFIG, c);
  S.profile = cleanProfile(S.profile);   // 기능: profile_clean — 설정을 읽은 뒤 (스위치를 끄면 예전처럼 그대로)
  if (!on('data_fail_ui') && !DATA_SOURCE.live && DATA_SOURCE.samples) LISTINGS = DATA_SOURCE.samples;   // 기능 data_fail_ui 를 끄면 예전처럼 예시 공고로
  syncHome(S.profile);   // 설정을 읽은 뒤 예전 '서울 거주' 답을 사는 곳으로 옮김 (기기에만 반영, 저장은 다음 입력 때)
  if (on('analytics')) { if (CONFIG.cf_beacon) initCF(CONFIG.cf_beacon); else initGC(CONFIG.goatcounter); }
  if (c && ['feed', 'alerts', 'detail', 'grades', 'me'].includes(S.view)) render();
}).catch(() => {});
fetch('map.json', { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(c => {
  if (c && c.naver_map_key) { CONFIG.naver_map_key = c.naver_map_key; if (S.view === 'feed' || S.view === 'detail') render(); }
}).catch(() => {});
function loadListings(){
  if (on('data_fail_ui')) { DATA_SOURCE.state = 'loading'; DATA_SOURCE.err = ''; }
  return fetch('listings.json', { cache:'no-store' }).then(r => r.ok ? r.json() : Promise.reject('응답 ' + r.status)).then(async rows => {
    if (!Array.isArray(rows) || !rows.length) return Promise.reject('공고 0건');
    LISTINGS = rows.map(fromApi);
    let upd = '';
    if (on('fresh_time')) try { const t = await fetch('data-updated.txt', { cache:'no-store' }); if (t.ok) upd = (await t.text()).trim(); } catch(e) {}   // 마지막으로 공고를 실제로 받은 시각 (기능: fresh_time)
    if (!/^\d{4}-\d\d-\d\d \d\d:\d\d/.test(upd)) { upd = ''; try { const t = await fetch('updated.txt', { cache:'no-store' }); if (t.ok) upd = (await t.text()).trim(); } catch(e) {} }
    DATA_SOURCE = { live:true, updated: upd, state:'live' };
    S.plan = {}; S.f = Object.assign({}, F0); if (S.view === 'detail' || S.view === 'plan') S.view = 'feed';
    render();
    if (navPending && on('history_nav')) {   // 공유 링크·새로고침: #/detail/<id> 를 데이터를 읽은 뒤 연다 (기능: history_nav)
      const ok = navApply(navPending);
      try { history.replaceState({ nav:1, v: S.view, id: ok ? S.id : null, y: 0 }, '', ok ? navUrl(S.view) : location.pathname + location.search); } catch(e) {}
      navPending = null;
    }
  }).catch(e => {
    if (!on('data_fail_ui')) return;   // 끄면 예전처럼 코드 안의 예시 공고로 동작
    if (LISTINGS.length) DATA_SOURCE.samples = LISTINGS;   // 스위치를 끈 설정이 늦게 오면 되돌릴 수 있게 보관
    LISTINGS = [];   // 코드 안의 예시 공고(강변역·샘플 B~D)를 실제 공고처럼 쓰지 않는다
    DATA_SOURCE.state = 'error'; DATA_SOURCE.err = typeof e === 'string' ? e : (e && e.message ? '네트워크 오류' : '');
    if (['feed', 'detail', 'plan'].includes(S.view)) { if (S.view !== 'feed') S.view = 'feed'; render(); }
  });
}
loadListings();
setTimeout(visitMetrics, 1200);   // 기능: usage_metrics
</script>
