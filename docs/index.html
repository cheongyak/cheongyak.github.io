code.topic{font-family:ui-monospace,Menlo,monospace;background:var(--sunk);padding:2px 6px;border-radius:6px;font-size:13px;overflow-wrap:anywhere}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}

<script>

  dsr: 0.40, stressRate: 0.07, years: 30,                 // DSR, 심사 금리 가정(기본 4% + 스트레스 3%), 만기
  dutyDeferralYears: 3                                    // 거주의무 시작 유예 (최초 입주가능일부터)
};

    price:12.2202, ext:0.2178, contractRate:0.10,

  { id:'b', sample:true, name:'샘플 단지 B', loc:'샘플 데이터 · 서울 공공택지', region:'서울', kind:'1순위 · 추첨제 · 분양가상한제', unit:'84㎡',
    notice:null, apply:null, price:9.4, ext:0, contractRate:0.10, mktLow:11.5, mktBase:12.5, mktNote:'샘플 값', jeonse:5.5, jeonseNote:'샘플 값',
    capital:true, regulated:true, landPermit:true, priceCap:true, residenceDuty:3, jeonseWeak:false, unregistered:true,
    needHead:true, needAccount:true, limits:[['재당첨 제한','10년'],['실거주 의무','3년']], sources:[] },
  { id:'c', sample:true, name:'샘플 단지 C', loc:'샘플 데이터 · 경기 비규제지역', region:'경기', kind:'무순위 · 잔여세대', unit:'59㎡',
    notice:null, apply:null, price:8.1, ext:0, contractRate:0.10, mktLow:8.4, mktBase:8.9, mktNote:'샘플 값', jeonse:4.5, jeonseNote:'샘플 값',

    needHead:false, needAccount:true, limits:[['실거주 의무','없음']], sources:[] }
];
const TODAY = (() => { const d = new Date(Date.now() + 9*3600e3); return d.toISOString().slice(0,10); })(); // 한국 날짜
let DATA_SOURCE = { live:false, updated:'' };
let CONFIG = { ntfy_server:'https://ntfy.sh', ntfy_topic:'cheongyak-97ecbdb4', site_url:'' };

/* ---------- 내 조건 (대화에서 알려주신 값으로 시작) ---------- */
const DEFAULT_PROFILE = { seoul:true, household:'parents', parents60:true, parentsOwn:true, headSince:'',
  selfOwn:false, married:false, spouseOwn:false, spouseIncome:0, spouseLoan:0, account:'unknown', recentWin:false,
  cash:32500, liquid:0, deposit:0, income:4000, loanMonthly:0, firstTime:true };

const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const S = { view:'feed', step:0, id:null, filter:'all', plan:{}, profile: Object.assign({}, DEFAULT_PROFILE, store.get('cy-profile') || {}) };

/* ---------- 계산 엔진 ---------- */
const eok = v => v/10000; // 만원 -> 억
function fmt(v){ // 억 단위 숫자 -> 표기
  const s = v < 0 ? '−' : ''; const a = Math.abs(v);
  if (a >= 1) return s + (Math.round(a*100)/100).toFixed(2).replace(/\.?0+$/,'') + '억';
  return s + Math.round(a*10000).toLocaleString('ko-KR') + '만';
}
function acqTax(base){ // 1주택 취득세 + 지방교육세 (85㎡ 이하 가정)
  let r = base <= 6 ? 0.01 : base <= 9 ? (base*2/3 - 3)/100 : 0.03;
  return base * r * 1.1;
}
function grade(L){
  const base = L.price + L.ext, tax = acqTax(base), cost = base + tax;
  if (L.mktLow == null || L.mktBase == null) return { g:'unknown', lo:null, hi:null, rate:null, cost, tax, base };
  const lo = L.mktLow - cost, hi = L.mktBase - cost, rate = lo / cost;
  let g = lo >= RULES.lottoAbs || rate >= RULES.lottoRate ? 'lotto' : lo >= RULES.considerAbs ? 'consider' : lo >= 0 ? 'flat' : 'pass';
  return { g, lo, hi, rate, cost, tax, base };
}
const GNAME = { lotto:'로또', consider:'고려', flat:'마진없음', pass:'패스', unknown:'시세 부족' };
const GORDER = { lotto:0, consider:1, flat:2, pass:3, unknown:4 };
function marginText(m){
  if (m.g === 'unknown') return '시세 확인 필요';
  if (m.g === 'pass') return '마진 ' + fmt(m.hi) + ' ~ ' + fmt(m.lo);
  const a = (m.lo >= 0 ? '+' : '') + fmt(m.lo), b = (m.hi >= 0 ? '+' : '') + fmt(m.hi);
  return '마진 ' + a + '~' + b.replace('+','');
}

function eligibility(L, p){
  const items = [];
  if (L.region === '서울') items.push({ k:'거주지 (서울)', s: p.seoul ? 'ok' : 'fail', v: p.seoul ? '충족' : '미충족' });
  else if (L.region === '경기') items.push({ k:'거주지 (수도권)', s: p.seoul ? 'ok' : 'warn', v: p.seoul ? '충족' : '확인 필요', note: p.seoul ? '해당 지역 우선공급 대상은 아니에요' : '' });
  else items.push({ k:'거주지 (' + L.region + ')', s:'warn', v:'확인 필요', note:'공고문의 거주 지역 요건을 확인하세요' });
  const own = []; let homeNote = '';
  if (p.selfOwn) own.push('본인 명의 주택');
  if (p.married && p.spouseOwn) own.push('배우자 명의 주택');
  if (p.household === 'parents' && p.parentsOwn) { if (p.parents60) homeNote = '부모님 주택: 만 60세 이상 예외 적용'; else own.push('부모님 주택 (만 60세 미만)'); }
  if (!p.married) homeNote = (homeNote ? homeNote + ' · ' : '') + '혼인신고 전: 배우자 주택 미합산';
  items.push({ k:'무주택 세대', s: own.length ? 'fail' : 'ok', v: own.length ? '미충족' : '충족', note: own.length ? own.join(', ') : homeNote });
  if (L.needHead) {
    let s = 'fail', v = '미충족', note = L.notice ? '공고일 ' + L.notice.slice(5).replace('-','.') + ' 기준' : '';
    if (p.household === 'head') {
      if (L.notice && p.headSince && p.headSince > L.notice) { note = '공고일보다 늦게 세대주가 됐어요'; }
      else { s = 'ok'; v = '충족'; }
    }
    items.push({ k:'세대주', s, v, note });
  }
  items.push({ k:'청약통장', s: !L.needAccount ? 'na' : p.account === 'yes' ? 'ok' : p.account === 'no' ? 'fail' : 'warn',
    v: !L.needAccount ? '불필요' : p.account === 'yes' ? '충족' : p.account === 'no' ? '미충족' : '확인 필요' });
  items.push({ k:'재당첨 제한', s: p.recentWin ? 'fail' : 'ok', v: p.recentWin ? '제한 중' : '없음' });
  const fails = items.filter(i => i.s === 'fail'), warns = items.filter(i => i.s === 'warn');
  let reason = '', fix = '';
  if (fails.length) {
    const f = fails[0];
    reason = f.k === '세대주' ? (L.notice ? '모집공고일(' + L.notice.replace(/-/g,'.') + ') 기준 세대주가 아니에요. 지금 바꿔도 이번 공고에는 반영되지 않아요.' : '세대주가 아니에요.')
      : f.k.startsWith('무주택') ? '세대에 주택 소유자가 있어요 (' + f.note + ').'
      : f.k.startsWith('거주') ? L.region + ' 거주자만 신청할 수 있어요.'
      : f.k === '청약통장' ? '1순위 청약통장 요건을 채우지 못했어요.' : '재당첨 제한 기간이에요.';
    if (fails.some(i => i.k === '세대주')) {
      fix = p.household === 'parents' && p.parents60
        ? '부모님이 모두 만 60세 이상이라 세대주만 본인으로 변경하면 무주택 세대주가 돼요. 다음 공고부터 적용돼요.'
        : '다음 공고의 모집공고일 전에 세대주가 되어 두세요. 전입신고로 세대를 만들 때는 실제로 살아야 해요.';
    }
  }
  return { ok: !fails.length, unsure: !fails.length && warns.length > 0, items, reason, fix };
}

function funding(L, p, opt){
  const m = grade(L);
  const total = m.cost;
  const contractAmt = (L.price + L.ext) * L.contractRate;
  const family = eok(opt.family || 0);
  const cashNow = eok(p.cash);
  const available = eok(p.cash + p.liquid + p.deposit) + family;
  const income = eok(p.income + (p.married ? p.spouseIncome : 0));
  const existing = eok((p.loanMonthly + (p.married ? p.spouseLoan : 0)) * 12);
  const r = RULES.stressRate / 12, n = RULES.years * 12;
  const monthly = Math.max(0, income * RULES.dsr - existing) / 12;
  const loanDsr = monthly * (1 - Math.pow(1 + r, -n)) / r;
  const ltvRate = L.regulated ? RULES.ltvRegulated : RULES.ltvOther;
  const loanLtv = Math.min(L.price, L.mktBase) * ltvRate;
  const cap = L.regulated ? RULES.loanCapRegulated.find(c => L.mktBase <= c[0])[1] : L.capital ? RULES.loanCapCapital : Infinity;
  const loan = Math.min(loanDsr, loanLtv, cap);
  const limitBy = loan === loanDsr ? 'DSR(소득)' : loan === cap ? '한도 ' + cap + '억' : 'LTV ' + ltvRate*100 + '%';
  const jeonse = opt.jeonse != null ? eok(opt.jeonse) : (L.jeonse || 0);
  return { total, contractAmt, contractOk: cashNow >= contractAmt, available, loan, loanDsr, loanLtv, ltvRate, cap, limitBy, jeonse,
    gapLive: total - loan - available, gapJeonse: total - jeonse - available, tax: m.tax };
}

/* 전세로 잔금을 치를 수 있는지: 지역·단지 규제를 따져서 가능 / 조건부 / 불가 */
function jeonseCheck(L){
  const R = []; let status = 'ok';
  const add = (lvl, t) => { R.push({ lvl, t }); if (lvl === 'no') status = 'no'; else if (lvl === 'cond' && status === 'ok') status = 'cond'; };
  if (L.residenceDuty == null) add('cond', '분양가상한제 단지라 실거주 의무가 있을 수 있어요. 공고문에서 거주의무 기간을 확인하세요.');
  if (L.jeonse == null) add('cond', '주변 전세 거래가 부족해 보증금을 추정하지 못했어요. 아래에 직접 입력해 주세요.');
  if (L.residenceDuty > 0) {
    add('cond', '실거주 의무 ' + L.residenceDuty + '년이 있어요. 최초 입주가능일부터 ' + RULES.dutyDeferralYears + '년 안에만 들어가 살면 돼서 전세는 한 번(2년)만 줄 수 있어요. 그때 돌려줄 보증금을 따로 마련해야 해요.');
  }
  if (L.regulated && L.capital) add('cond', '수도권 규제지역이라 세입자가 소유권이전 조건부 전세대출을 쓰기 어려워요. 보증금을 현금으로 낼 수 있는 세입자만 받을 수 있어서 보증금을 낮게 잡는 게 안전해요.');
  else if (L.unregistered) add('info', '입주 직후엔 등기 전이라 세입자 전세대출 심사가 까다로울 수 있어요. 은행에 미리 확인하세요.');
  if (L.regulated) add('info', '규제지역에서 주담대를 받으면 6개월 안에 전입해야 해요. 잔금대출과 전세를 함께 쓸 수는 없어요.');
  else add('info', '비규제지역이라 전입 의무가 없어요. 다만 선순위 대출이 있으면 세입자가 꺼려서 보증금이 낮아져요.');
  if (L.landPermit) add('info', '토지거래허가구역이지만 최초 분양계약은 허가 대상이 아니에요. 나중에 팔 때는 매수자에게 실거주 의무가 붙어요.');
  if (L.jeonseWeak) add('cond', '전세 수요가 약한 지역이에요. 입주장에 세입자를 못 구하면 잔금을 못 치를 수 있어요.');
  return { status, reasons: R };
}
function planOpt(L){
  if (!S.plan[L.id]) S.plan[L.id] = { mode: jeonseCheck(L).status === 'no' ? 'live' : 'jeonse', family:0, jeonse: Math.round((L.jeonse || 0)*10000) };
  return S.plan[L.id];
}
function bestGap(f, o){ return o.mode === 'live' ? f.gapLive : f.gapJeonse; }

function dday(d){ if(!d) return '샘플'; const n = Math.round((new Date(d) - new Date(TODAY)) / 864e5); return (n > 0 ? 'D-' + n : n === 0 ? 'D-day' : '마감') + ' · ' + d.slice(5).replace('-','.'); }
function profileLine(p){

    if (fd.type === 'choice') {
      const opts = fd.o.map(([v, t]) => { const on = p[fd.k] === v; return `<button class="opt" role="radio" aria-checked="${on}" data-set="${fd.k}" data-val='${JSON.stringify(v)}'>${t}${on ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' : ''}</button>`; }).join('');
      return `<div class="field">${fd.l ? `<span class="lbl" id="l-${fd.k}">${fd.l}</span>` : ''}<div role="radiogroup" ${fd.l ? `aria-labelledby="l-${fd.k}"` : `aria-label="${esc(st.t)}"`} class="${fd.two ? 'opts-2' : 'stack'}">${opts}</div></div>`;
    }
    if (fd.type === 'date') return `<div class="field"><label for="f-${fd.k}">${fd.l}</label><input type="date" id="f-${fd.k}" data-field="${fd.k}" value="${p[fd.k] || ''}"></div>`;
    return `<div class="field"><label for="f-${fd.k}">${fd.l}</label><div class="money"><input id="f-${fd.k}" inputmode="numeric" data-field="${fd.k}" data-num="1" value="${p[fd.k] || ''}" placeholder="0"><span>만원</span></div>${fd.h ? `<span class="hint">${fd.h}</span>` : ''}${p[fd.k] ? `<span class="hint" data-echo="${fd.k}">= ${fmt(eok(p[fd.k]))}</span>` : `<span class="hint" data-echo="${fd.k}"></span>`}</div>`;
  };
  const note = st.note && st.note(p);
  return `
  <div class="stack" style="gap:10px;padding-top:8px">
    <div class="row small muted"><span>내 조건 입력</span><span>${i + 1} / ${steps.length}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${steps.length}" aria-valuenow="${i + 1}"><i style="width:${(i + 1) / steps.length * 100}%"></i></div>
  </div>
  <div class="stack" style="gap:6px"><h1>${st.t}</h1><p class="muted" style="margin:0;font-size:14px">${st.d}</p></div>
  ${st.f.map(field).join('')}
  ${note ? `<div class="note info"><b style="font-size:13px">이렇게 판정돼요</b><div>${note}</div></div>` : ''}
  <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px">
    <button class="btn ghost" data-action="prev">${i === 0 ? '닫기' : '이전'}</button>
    <button class="btn" data-action="next">${i === steps.length - 1 ? '판정 보기' : '다음'}</button>
  </div>`;
}

/* ---------- 라우팅 & 이벤트 ---------- */
const app = document.getElementById('app'), tabbar = document.getElementById('tabbar');
const VIEWS = { feed:vFeed, detail:vDetail, plan:vPlan, grades:vGrades, me:vMe, onboard:vOnboard, alerts:vAlerts };
let lastView = null;
function render(){
  app.innerHTML = VIEWS[S.view]();
  tabbar.hidden = S.view === 'onboard';
  const tab = { feed:'feed', detail:'feed', plan:'feed', alerts:'feed', grades:'grades', me:'me' }[S.view];
  tabbar.querySelectorAll('button').forEach(b => { if (b.dataset.go === tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if (lastView !== S.view) window.scrollTo(0, 0);
  lastView = S.view;
}
function go(v){ S.view = v; render(); }
function save(){ store.set('cy-profile', S.profile); }

document.addEventListener('click', ev => {
  const t = ev.target.closest('button,a'); if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.open) { S.id = t.dataset.open; go('detail'); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.set) { S.profile[t.dataset.set] = JSON.parse(t.dataset.val); save(); render(); return; }
  if (t.dataset.mode) { planOpt(LISTINGS.find(x => x.id === S.id)).mode = t.dataset.mode; render(); return; }
  const a = t.dataset.action;
  if (a === 'copy-topic') {
    const done = () => { t.textContent = '복사했어요'; };
    try { navigator.clipboard.writeText(CONFIG.ntfy_topic).then(done, () => { t.textContent = CONFIG.ntfy_topic; }); } catch(e) { t.textContent = CONFIG.ntfy_topic; }
    return;
  }
  if (a === 'restart') { S.step = 0; go('onboard'); }
  if (a === 'prev') { if (S.step === 0) go('me'); else { S.step--; render(); } }
  if (a === 'next') { const n = visibleSteps().length; if (S.step >= n - 1) { save(); go('feed'); } else { S.step++; render(); } }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.field) {
    let v = el.value;
    if (el.dataset.num) { v = Number(String(v).replace(/[^0-9]/g, '')) || 0; const e = app.querySelector(`[data-echo="${el.dataset.field}"]`); if (e) e.textContent = v ? '= ' + fmt(eok(v)) : ''; }
    S.profile[el.dataset.field] = v; save();
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.plan) { planOpt(LISTINGS.find(x => x.id === S.id))[el.dataset.plan] = Number(String(el.value).replace(/[^0-9]/g, '')) || 0; render(); }
});

/* 실제 데이터: 같은 폴더의 listings.json (GitHub Actions 가 매일 갱신). 없으면 샘플로 동작 */
function fromApi(x){
  return { id:x.id, sample:false, name:x.name, loc:(x.address || '').replace(/특별시|광역시|특별자치시|특별자치도/g,'').replace(/\s+/g,' ').trim(),
    region:x.region, kind:x.kind, unit:x.unit + (x.households ? ' · ' + x.households + '세대' : ''),
    notice:x.notice, apply:x.apply, winner:x.winner, contract:x.contract, balance:x.balance,
    price:x.price, ext:x.ext || 0, contractRate:x.contract_rate || 0.1, midRate:x.mid_rate || 0,
    mktLow:x.mkt_low, mktBase:x.mkt_base, mktNote:x.mkt_note || '', jeonse:x.jeonse, jeonseNote:x.jeonse_note || '',
    capital:x.capital, regulated:x.regulated, landPermit:x.land_permit, priceCap:x.price_cap, residenceDuty:x.residence_duty,
    jeonseWeak:x.jeonse_weak, unregistered:x.unregistered, needHead:x.need_head, needAccount:x.need_account,
    limits:(x.limits || []).map(l => [l[0], l[1]]), sources: x.url ? [['모집공고 (청약홈)', x.url]] : [] };
}
render();
fetch('config.json', { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(c => { if (c && c.ntfy_topic) { CONFIG = Object.assign(CONFIG, c); if (S.view === 'alerts') render(); } }).catch(() => {});
fetch('listings.json', { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(async rows => {
  if (!Array.isArray(rows) || !rows.length) return;
  LISTINGS = rows.map(fromApi);
  let upd = ''; try { const t = await fetch('updated.txt', { cache:'no-store' }); if (t.ok) upd = (await t.text()).trim(); } catch(e) {}
  DATA_SOURCE = { live:true, updated: upd };
  S.plan = {}; if (S.view === 'detail' || S.view === 'plan') S.view = 'feed';
  render();
}).catch(() => {});
</script>
