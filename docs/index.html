/* 판정 근거 추적 (개발자용, 화면에는 보이지 않음). 브라우저 콘솔에서 cpExplain('<주택형 id>') 로 '왜 이 판정이 나왔는지'를 본다.

const CAUSE_NAME = { A:'사용자 정보 부족', B:'공식 기준 정보 부족', C:'공고 적용 여부 불명확', D:'공식 자료 충돌', E:'데이터 수집 실패' };

}
function itemBasis(L, k){
  const notice = { kind:'모집공고문', name:(L.name || '') + ' 모집공고문', url: L.noticePdf || (L.sources && L.sources[0] && L.sources[0][1]) || null, why:'이 공고문에서 읽은 기준' };

  if (k.startsWith('거주지')) return L.residence ? notice : { kind:'추정', name:'지역 기준 추정', url:null, why:'공고문 거주 요건을 읽지 못함' };
  if (k.startsWith('재당첨 제한 (내 이력)')) return { kind:'사용자 입력', name:'내가 입력한 값', url:null, why:'내 청약 이력' };
  if (k === '청약통장 가입기간') return fromNotice(L, '1순위 가입기간') ? notice : law('주택공급에 관한 규칙 제27·28조', '공고문에서 읽지 못해 지역 기준(수도권 12·그 밖 6·규제 24개월)');
  if (k === '예치금 (민영)') return law('주택공급에 관한 규칙 별표2 (공고문 예치금 표와 같음)', '예치금 표는 전국 공통');
  if (k === '무주택 세대') return law('주택공급에 관한 규칙 제2조·제53조', '무주택세대구성원 정의·주택 소유 판정 공통 기준');
  if (k.includes('(규제지역 1순위)') || k.endsWith('전용') || k.includes('(공공 일반공급)') || k.includes('(신혼희망타운)') || k.startsWith('통장 종류') || k.startsWith('납입 인정') || k.startsWith('당첨자 선정')) return notice;

function cpExplain(id, profile){

  const p = profile || S.profile, e = eligibility(L, p);
  return { id, name: L.name, unit: L.unit, dataUpdated: DATA_SOURCE.updated, fromNotice: L.fromNotice || [],

/* ---------- 비교함 (기능: compare) : 관심 공고 중 최대 3개를 나란히 ---------- */
function cmpPool(){ return LISTINGS.filter(L => WATCH.has(L.id) && !L.sample).sort((a, b) => (statusOf(a) === '마감') - (statusOf(b) === '마감')); }
function cmpList(){
  const pool = cmpPool(), ids = (S.cmp || []).filter(id => pool.some(L => L.id === id));
  const pick = ids.length ? ids : pool.slice(0, 3).map(L => L.id);
  return pick.map(id => pool.find(L => L.id === id)).filter(Boolean);
}
function compareEntry(){
  if (!on('compare') || S.filter !== 'watch') return '';

}

  const C = list.map(L => { const m = grade(L), f = funding(L, p, planOpt(L)), e = eligibility(L, p), h = on('competition') ? compHead(L.competition) : null; return { L, m, f, e, h }; });

/* ---------- 지역별 당첨 가점 컷 (기능: score_cut) ----------
   docs/cmpet-history.json (청약홈 경쟁률·당첨 가점 기록) 에서 1순위 해당지역 가점제 당첨자의 최저 가점을 지역별로 모은다.
   최저 가점 0 은 가점제 당첨자가 없던 경우라 뺀다. */
let HIST = null, HIST_ERR = '';
function loadHist(){
  if (HIST || HIST_ERR) return;
  fetch('cmpet-history.json', { cache:'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(h => { HIST = h; if (S.view === 'trend') render(); })
    .catch(e => { HIST_ERR = '기록을 불러오지 못했어요 (' + e + ')'; if (S.view === 'trend') render(); });
}
function cutRows(){
  const out = [];
  Object.entries(HIST || {}).forEach(([no, v]) => {
    if (v.category === 'remainder') return;
    Object.values(v.units || {}).forEach(u => {
      if (String(u.rank) !== '1' || !(u.reside || '').includes('해당') || u.low == null || !(u.low > 0)) return;
      out.push({ no, name: v.name, sido: v.sido, sg: (v.sigungu || '').split(' ')[0], notice: v.notice || v.apply || '', unit: u.unit, low: u.low, avg: u.avg, top: u.top, url: v.url });
    });
  });
  return out;
}
const median = a => { const b = a.slice().sort((x, y) => x - y), n = b.length; return n ? (n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2) : null; };
function cutBar(lows, mine){
  const lo = Math.min(...lows), hi = Math.max(...lows), md = median(lows), pct = v => (v / 84 * 100).toFixed(1) + '%';
  return `<div class="cutbar" aria-hidden="true"><span class="rng" style="left:${pct(lo)};width:${pct(hi - lo)}"></span><span class="md" style="left:${pct(md)}"></span>${mine != null ? `<span class="me" style="left:${pct(mine)}"></span>` : ''}</div>`;
}
/* ---------- 관심 공고 내 당첨 점수 (기능: watch_scores) ----------
   관심(★) 주택형마다 일반공급·특별공급 유형별 내 판정과 점수를 크게 모아 보여주고, 어느 특별공급을 쓰면 유리한지 고른다.

let lastTrack = '';

/* 뒤로가기·주소 (기능: history_nav). 화면을 바꿀 때 브라우저 기록에 남겨 뒤로가기가 사이트 안에서 이전 화면으로 돌아가게 한다.
   주소: 목록 = 사이트 주소 그대로, 공고 = #/detail/<주택형 id>, 그 밖 = #/<화면>. 새로고침·공유 링크는 데이터를 읽은 뒤 그 화면을 연다 */
const NAV_ID_VIEWS = ['detail', 'plan'];
const NAV_VIEWS = ['feed', 'detail', 'plan', 'grades', 'me', 'about', 'story', 'terms', 'privacy', 'trend', 'alerts', 'compare', 'updates'];

function navUrl(v){ return v === 'feed' ? location.pathname + location.search : '#/' + v + (NAV_ID_VIEWS.includes(v) && S.id ? '/' + encodeURIComponent(S.id) : ''); }

  if (p.everWin === 'none') { p.win5y = false; p.recentWin = false; p._winAuto = true; }
  else if (p.everWin === 'yes' && p._winAuto) { p.win5y = null; p.recentWin = null; p._winAuto = false; }
  if (on('residence_v2') && CAPITAL3.includes(p.homeSido) && !p.sidoSince && p.sidoOwnSince) p.sidoSince = p.sidoOwnSince;
  return p;
}
function save(){ store.set('cy-profile', syncV2(syncHome(S.profile))); }

document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
document.addEventListener('click', ev => {
  if (ev.target.classList && ev.target.classList.contains('sheet-bg')) { S.sheet = null; render(); return; }
  const t = ev.target.closest('button,a'); if (!t) return;
  if (t.dataset.ev) { const L = S.id && LISTINGS.find(x => x.id === S.id); track({ path: 'click-' + t.dataset.ev, title: L ? L.name : '', event: true }); }
  if (t.dataset.feedmode) { S.feedMode = t.dataset.feedmode; S.mapPick = null; render(); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.newdays != null) { S.newDays = Number(t.dataset.newdays); track({ path:'new-' + S.newDays, event:true }); render(); return; }
  if (t.dataset.watch) { const id = t.dataset.watch; if (WATCH.has(id)) WATCH.delete(id); else WATCH.add(id); saveWatch(); track({ path:'watch', event:true }); render(); return; }
  if (t.dataset.cmp) { const id = t.dataset.cmp, cur = cmpList().map(L => L.id); S.cmp = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat(id).slice(-3); if (S.cmp.length < 2) S.cmp = cur; render(); return; }
  if (t.dataset.action === 'cmp-back') { S.filter = 'watch'; go('feed'); return; }
  if (t.dataset.cutsido) { S.cutSido = t.dataset.cutsido; render(); return; }
  if (t.dataset.sheet) { S.sheet = t.dataset.sheet; track({ path:'sheet-' + S.sheet, event:true }); render(); return; }
  if (t.dataset.action === 'sheet-close') { S.sheet = null; render(); return; }
  if (t.dataset.open && S.sheet) S.sheet = null;
  if (t.dataset.open) { S.id = t.dataset.open; go('detail'); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.unset) { const k = t.dataset.unset; if (k === 'date') { S.f.from = ''; S.f.to = ''; } else { S.f[k] = ''; if (k === 'sido') S.f.district = ''; } render(); return; }
  if (t.dataset.set) { S.profile[t.dataset.set] = JSON.parse(t.dataset.val); save(); render(); return; }
  if (t.dataset.elig) { S.elig = S.elig === t.dataset.elig ? null : t.dataset.elig; track({ path:'elig-' + (S.elig || 'off'), event:true }); render();
    if (S.elig) { const fb = app.querySelector('.findbox .filterbar'); if (fb) fb.scrollIntoView({ behavior:'smooth', block:'start' }); } return; }
  if (t.dataset.edit) { S.quick = false; const i = visibleSteps().findIndex(x => stepKey(x) === t.dataset.edit); S.step = Math.max(0, i); S.fromMe = true; go('onboard'); window.scrollTo(0, 0); return; }   // 그 단계부터 이어서 입력, 단계마다 저장하고 나가기
  if (t.dataset.mode) { planOpt(LISTINGS.find(x => x.id === S.id)).mode = t.dataset.mode; render(); return; }
  const a = t.dataset.action;
  if (a === 'toggle-closed') { S.showClosed = !S.showClosed; render(); return; }
  if (a === 'toggle-filters') { S.showFilters = !S.showFilters; render(); return; }
  if (a === 'reload-data') { DATA_SOURCE.state = 'loading'; render(); loadListings(); return; }   // 기능: data_fail_ui
  if (a === 'reset-filters') { S.f = Object.assign({}, F0); S.filter = 'all'; S.newDays = 0; S.q = ''; S.elig = null; render(); return; }
  if (a === 'clear-q') { S.q = ''; render(); const q = app.querySelector('#q'); if (q) refocus(q); return; }
  if (t.dataset.pushsido && PUSH.prefs) { const r = PUSH.prefs.regions, x = t.dataset.pushsido; PUSH.prefs.regions = r.includes(x) ? r.filter(v => v !== x) : SIDO_ORDER.filter(v => v === x || r.includes(v)); PUSH.msg = ''; render(); return; }   // 기능: web_push
  if (t.dataset.pushopt && PUSH.prefs) { PUSH.prefs[t.dataset.pushopt] = !PUSH.prefs[t.dataset.pushopt]; PUSH.msg = ''; render(); return; }
  if (a === 'push-on') { pushSubscribe(); return; }
  if (a === 'push-save') { pushSave(); return; }
  if (a === 'push-off') { pushUnsubscribe(); return; }
  if (a === 'wipe') { if (!confirm('이 기기에 저장된 내 정보를 모두 지울까요?')) return; try { localStorage.removeItem('cy-profile'); localStorage.removeItem('cy-watch'); } catch(e) {} WATCH.clear(); S.profile = Object.assign({}, DEFAULT_PROFILE); S.step = 0; go('onboard'); return; }
  if (a === 'install' && installEvt) { const e = installEvt; installEvt = null; e.prompt(); (e.userChoice || Promise.resolve()).then(() => render()); track({ path:'install', event:true }); return; }
  if (a === 'sp-home') { S.fromMe = false; let i = visibleSteps().findIndex(x => x.id === 'sp5'); if (i < 0) i = visibleSteps().findIndex(x => x.id === 'home'); S.step = Math.max(0, i); go('onboard'); return; }
  if (a === 'sp-input') { S.fromMe = false; const i = visibleSteps().findIndex(x => x.id === 'sp1'); S.step = Math.max(0, i); go('onboard'); return; }
  if (a === 'restart') { S.quick = false; S.step = 0; S.fromMe = S.view === 'me'; go('onboard'); }
  if (a === 'quick-start') { S.quick = true; S.step = 0; S.fromMe = false; metric('quick/start'); go('onboard'); return; }   // 기능: quick_start
  if (a === 'onboard-exit') { S.quick = false; save(); track({ path:'onboard-exit', event:true }); const back = S.fromMe ? 'me' : 'feed'; S.fromMe = false; go(back); return; }
  if (a === 'prev') { if (S.step === 0) { if (quickMode()) { S.quick = false; go('feed'); return; } go('me'); } else { S.step--; render(); } }
  if (a === 'next') { const n = visibleSteps().length, cur = visibleSteps()[S.step]; if (cur) metric('onboard/' + stepKey(cur)); if (S.step >= n - 1) { if (quickMode()) { S.quickDone = true; metric('quick/done'); } S.quick = false; S.fromMe = false; save(); track({ path:'onboard-done', event:true }); metric('onboard/done'); go('feed'); } else { S.step++; render(); } }
});
/* 검색어를 칠 때는 검색창은 그대로 두고 나머지만 다시 그린다 (다시 만들면 폰 키보드가 닫히고 커서가 튄다) */
let qTimer = null, qTracked = false;
function renderKeepSearch(){
  const wrap = app.querySelector('#searchwrap');
  if (S.view !== 'feed' || !wrap) { render(); return; }
  const tmp = document.createElement('div'); tmp.innerHTML = VIEWS.feed();
  const nw = tmp.querySelector('#searchwrap'); if (!nw) { render(); return; }
  // 검색창에서 app 까지 올라가며 층마다 검색창(또는 그 조상)만 남기고 형제를 새것으로 바꾼다 (검색창이 묶음 안에 있어도 됨)
  let node = wrap, fresh = nw;
  while (node !== app) {
    const par = node.parentNode, npar = fresh.parentNode;
    if (!par || !npar) { render(); return; }
    while (node.previousSibling) node.previousSibling.remove();
    while (node.nextSibling) node.nextSibling.remove();
    while (fresh.previousSibling) node.before(npar.firstChild);   // 앞쪽 형제를 순서대로 옮김
    while (fresh.nextSibling) par.appendChild(fresh.nextSibling);
    node = par; fresh = npar;
  }
  const c = wrap.querySelector('.qclear'); if (c) c.hidden = !S.q;
  afterRender();
}
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.q !== undefined && el.id === 'q') {
    S.q = el.value; clearTimeout(qTimer); qTimer = setTimeout(renderKeepSearch, 150);
    if (!qTracked && S.q.trim()) { qTracked = true; track({ path:'search', event:true }); }   // 검색어 내용은 보내지 않음
    return;
  }
  if (el.dataset.field) {
    let v = el.value;
    if (el.dataset.count) v = String(v).trim() === '' ? null : (Number(String(v).replace(/[^0-9]/g, '')) || 0);
    if (el.dataset.opt && on('town_assets') && /-/.test(v)) { el.value = ''; el.setAttribute('placeholder', '0 이상 금액만 넣을 수 있어요'); }   // 음수 입력은 지우고 안내
    if (el.dataset.opt) v = String(v).trim() === '' || (on('town_assets') && /-/.test(v)) ? null : (Number(String(v).replace(/[^0-9]/g, '')) || 0);   // 음수는 받지 않고 '입력 안 함'으로 둔다 (기능: town_assets)
    if (el.dataset.num) { v = Number(String(v).replace(/[^0-9]/g, '')) || 0; const e = app.querySelector(`[data-echo="${el.dataset.field}"]`); if (e) e.textContent = v ? '= ' + fmt(eok(v)) : ''; }
    S.profile[el.dataset.field] = v; save();
  }
});
/* 다시 그린 뒤 같은 입력칸에 포커스를 돌려준다(키보드 사용자용). 단 터치 기기의 선택창(select)은 포커스만 줘도
   아이폰 Safari 가 목록을 다시 열어 닫히지 않는 것처럼 보이므로 건너뛴다 */
const TOUCH = (() => { try { return matchMedia('(hover: none) and (pointer: coarse)').matches || /iPhone|iPad|iPod/.test(navigator.userAgent); } catch(e) { return false; } })();
function refocus(el){ if (!el || (TOUCH && el.tagName === 'SELECT')) return; try { el.focus({ preventScroll:true }); } catch(e) {} }
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.newsel) { S.newDays = Number(el.value) || 0; track({ path:'new-' + S.newDays, event:true }); render(); refocus(app.querySelector('[data-newsel]')); return; }
  if (el.dataset.f) {
    const k = el.dataset.f; S.f[k] = el.value; track({ path:'filter-' + k, event:true });
    if (k === 'sido') S.f.district = '';
    if (k === 'from' && S.f.to && S.f.from > S.f.to) S.f.to = S.f.from;   // 시작이 끝보다 늦으면 맞춰 준다
    if (k === 'to' && S.f.from && S.f.to < S.f.from) S.f.from = S.f.to;
    const id = el.getAttribute('data-f'); render();
    refocus(app.querySelector(`[data-f="${id}"]`));
    return;
  }
  if (el.dataset.plan) { planOpt(LISTINGS.find(x => x.id === S.id))[el.dataset.plan] = Number(String(el.value).replace(/[^0-9]/g, '')) || 0; render(); }
});

/* 실제 데이터: 같은 폴더의 listings.json (GitHub Actions 가 매일 갱신). 없으면 샘플로 동작 */
function fromApi(x){
  return { id:x.id, sample:false, name:x.name, loc:(x.address || '').replace(/특별시|광역시|특별자치시|특별자치도/g,'').replace(/\s+/g,' ').trim(),
    region:x.region, kind:x.kind, target:x.target,
    sido:x.sido || null, district:x.district || null, supplyType:x.supply_type || x.kind,
    mktComps:x.mkt_comps || [], mktCount:x.mkt_count || 0, mktDirectExcluded:x.mkt_direct_excluded || 0, mktBasis:x.mkt_basis || null, jeonseComps:x.jeonse_comps || [],
    noticePdf:x.notice_pdf || null, category:x.category || null, area:x.area || null, accountMonths:x.account_months || null, depositCount:x.deposit_count || null, competition:x.competition || null, areaComps:Array.isArray(x.area_comps) ? x.area_comps : null, spCompetition:x.sp_competition || null, areaSp:Array.isArray(x.area_sp) ? x.area_sp : null, unitName:x.unit, address:x.address || '', geo:x.geo || null, nearby:Array.isArray(x.nearby) ? x.nearby : null, mapQuery:x.map_query || null, fromNotice:x.from_notice || [], checks:x.checks || [],
    specialApply:x.special_apply || null, houseDtl:x.house_dtl || null, rentSecd:x.rent_secd || null, applyEnd:x.apply_end || null, unit:x.unit + (x.households ? ' · ' + x.households + '세대' : ''), specialUnits:x.special_units || null, residence:x.residence || null, mcQuota:x.mc_quota || null, schedule:x.schedule || null, pubLimits:x.pub_limits || null,
    notice:x.notice, apply:x.apply, winner:x.winner, contract:x.contract, balance:x.balance,
    price:x.price, ext:x.ext || 0, contractRate:x.contract_rate || 0.1, midRate:x.mid_rate || 0,
    mktLow:x.mkt_low, mktBase:x.mkt_base, mktNote:x.mkt_note || '', jeonse:x.jeonse, jeonseNote:x.jeonse_note || '',
    capital:x.capital, regulated:x.regulated, landPermit:x.land_permit, priceCap:x.price_cap, residenceDuty:x.residence_duty,
    jeonseWeak:x.jeonse_weak, unregistered:x.unregistered, needHead:x.need_head, needAccount:x.need_account,
    limits:(x.limits || []).map(l => [l[0], l[1]]), sources: x.url ? [['모집공고 (청약홈)', x.url]] : [] };
}
render();
try { navPending = navParse(location.hash); if (!(history.state && history.state.nav)) history.replaceState({ nav:1, v: S.view, id: null, y: 0 }, ''); } catch(e) {}   // 기능: history_nav
if (navPending && !NAV_ID_VIEWS.includes(navPending.v) && on('history_nav') && S.view !== 'onboard') { navApply(navPending); try { history.replaceState({ nav:1, v: S.view, id: null, y: 0 }, ''); } catch(e) {} navPending = null; }
fetch('config.json', { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(c => {
  if (c) CONFIG = Object.assign(CONFIG, c);
  if (!on('data_fail_ui') && !DATA_SOURCE.live && DATA_SOURCE.samples) LISTINGS = DATA_SOURCE.samples;   // 기능 data_fail_ui 를 끄면 예전처럼 예시 공고로
  syncHome(S.profile);   // 설정을 읽은 뒤 예전 '서울 거주' 답을 사는 곳으로 옮김 (기기에만 반영, 저장은 다음 입력 때)
  if (on('analytics')) { if (CONFIG.cf_beacon) initCF(CONFIG.cf_beacon); else initGC(CONFIG.goatcounter); }
  if (c && ['feed', 'alerts', 'detail', 'grades', 'me'].includes(S.view)) render();
}).catch(() => {});
fetch('map.json', { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(c => {
  if (c && c.naver_map_key) { CONFIG.naver_map_key = c.naver_map_key; if (S.view === 'feed' || S.view === 'detail') render(); }
}).catch(() => {});
function loadListings(){
  if (on('data_fail_ui')) { DATA_SOURCE.state = 'loading'; DATA_SOURCE.err = ''; }
  return fetch('listings.json', { cache:'no-store' }).then(r => r.ok ? r.json() : Promise.reject('응답 ' + r.status)).then(async rows => {
    if (!Array.isArray(rows) || !rows.length) return Promise.reject('공고 0건');
    LISTINGS = rows.map(fromApi);
    let upd = '';
    if (on('fresh_time')) try { const t = await fetch('data-updated.txt', { cache:'no-store' }); if (t.ok) upd = (await t.text()).trim(); } catch(e) {}   // 마지막으로 공고를 실제로 받은 시각 (기능: fresh_time)
    if (!/^\d{4}-\d\d-\d\d \d\d:\d\d/.test(upd)) { upd = ''; try { const t = await fetch('updated.txt', { cache:'no-store' }); if (t.ok) upd = (await t.text()).trim(); } catch(e) {} }
    DATA_SOURCE = { live:true, updated: upd, state:'live' };
    S.plan = {}; S.f = Object.assign({}, F0); if (S.view === 'detail' || S.view === 'plan') S.view = 'feed';
    render();
    if (navPending && on('history_nav')) {   // 공유 링크·새로고침: #/detail/<id> 를 데이터를 읽은 뒤 연다 (기능: history_nav)
      const ok = navApply(navPending);
      try { history.replaceState({ nav:1, v: S.view, id: ok ? S.id : null, y: 0 }, '', ok ? navUrl(S.view) : location.pathname + location.search); } catch(e) {}
      navPending = null;
    }
  }).catch(e => {
    if (!on('data_fail_ui')) return;   // 끄면 예전처럼 코드 안의 예시 공고로 동작
    if (LISTINGS.length) DATA_SOURCE.samples = LISTINGS;   // 스위치를 끈 설정이 늦게 오면 되돌릴 수 있게 보관
    LISTINGS = [];   // 코드 안의 예시 공고(강변역·샘플 B~D)를 실제 공고처럼 쓰지 않는다
    DATA_SOURCE.state = 'error'; DATA_SOURCE.err = typeof e === 'string' ? e : (e && e.message ? '네트워크 오류' : '');
    if (['feed', 'detail', 'plan'].includes(S.view)) { if (S.view !== 'feed') S.view = 'feed'; render(); }
  });
}
loadListings();
setTimeout(visitMetrics, 1200);   // 기능: usage_metrics
</script>
