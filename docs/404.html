<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페이지를 찾을 수 없어요 · 청약패스</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#15181A">
<style>
:root{--bg:#F1F3F1;--surface:#FFFFFF;--fg:#15181A;--muted:#566068;--line:#DDE1DD;--btn:#15181A;--btn-fg:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#101315;--surface:#191D20;--fg:#ECEFEE;--muted:#A2ABB1;--line:#2D3337;--btn:#ECEFEE;--btn-fg:#101315}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{max-width:440px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
img{width:64px;height:64px;border-radius:14px}
h1{font-size:22px;margin:16px 0 8px}
p{margin:0 0 20px;color:var(--muted);line-height:1.6;font-size:15px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:var(--btn);color:var(--btn-fg);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 없는 페이지예요.<br>청약패스 첫 화면에서 공고를 확인해 주세요.</p>
  <a class="btn" href="/">청약패스로 가기</a>
</main>
</body>
</html>
